<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edge AI: Facial Expression</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #result { font-size: 24px; font-weight: bold; margin-top: 20px; color: #2c3e50; }
        input[type="file"]:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>  

    <h1>Privacy-First Edge Inference</h1>
    <p>This model runs entirely in your browser. No data is sent to the cloud.</p>
    
    <input type="file" id="upload" accept="image/*" disabled>
    <br><br>
    <canvas id="canvas" width="224" height="224" style="border:1px solid #ccc;"></canvas>
    <div id="result">Waiting for image...</div>
    <div id="time" style="font-size: 16px; color: #7f8c8d; margin-top: 10px;"></div>

    <script>
        const emotions = ["Angry", "Disgust", "Fear", "Happy", "Sad", "Surprise", "Neutral"]; 
        
        let myEdgeModel = null;

        function softmax(arr) {
            const maxLogit = Math.max(...arr);
            const scores = arr.map(l => Math.exp(l - maxLogit));
            const sumScores = scores.reduce((a, b) => a + b, 0);
            return scores.map(s => s / sumScores);
        }

        async function loadModelOnce() {
            document.getElementById('result').innerText = "Downloading AI Brain...";
            try {
                // FIX 1: Force high precision and disable texture packing
                const options = {
                    executionProviders: ['webgl', 'wasm'],
                    graphOptimizationLevel: 'all',
                    extra: {
                        'webgl.force_half_precision': '0',
                        'webgl.pack': '0',
                        'webgl.async_download_timeout_ms': '0',
                    }
                };
                myEdgeModel = await ort.InferenceSession.create('./effnet_combined.onnx', options);
                
                document.getElementById('result').innerText = "Warming up GPU (Compiling Shaders)...";
                
                // FIX 2: 5-Pass Warm-up with dynamically regenerated noise
                const dummyData = new Float32Array(224 * 224);
                for (let run = 0; run < 5; run++) {
                    // Regenerate noise every loop so the GPU driver doesn't cheat
                    for (let i = 0; i < dummyData.length; i++) {
                        dummyData[i] = (Math.random() * 2) - 1; 
                    }
                    const dummyTensor = new ort.Tensor('float32', dummyData, [1, 1, 224, 224]);
                    await myEdgeModel.run({ input: dummyTensor });
                }

                document.getElementById('result').innerText = "AI Ready! Waiting for image...";
                document.getElementById('upload').disabled = false; 
                
            } catch (e) {
                console.error(e);
                document.getElementById('result').innerText = "Failed to load model.";
            }
        }
        
        loadModelOnce();
        
        async function runInference(tensorData) {
            if (!myEdgeModel) return;

            document.getElementById('result').innerText = "Inferring...";
            document.getElementById('time').innerText = ""; 
            
            try {
                const tensor = new ort.Tensor('float32', tensorData, [1, 1, 224, 224]);
                const feeds = { input: tensor };
                
                const startTime = performance.now();
                const results = await myEdgeModel.run(feeds);
                const endTime = performance.now();
                
                const inferenceTimeMs = (endTime - startTime).toFixed(1); 
                
                // FIX 4: Dynamically target the exact output node name
                const outputName = myEdgeModel.outputNames[0];
                const rawOutput = Array.from(results[outputName].data);
                const probabilities = softmax(rawOutput);
                
                let maxIdx = 0;
                let maxProb = 0;
                for (let i = 0; i < probabilities.length; i++) {
                    if (probabilities[i] > maxProb) {
                        maxIdx = i;
                        maxProb = probabilities[i];
                    }
                }
                
                const confidencePct = (maxProb * 100).toFixed(1);
                
                document.getElementById('result').innerText = `Predicted Emotion: ${emotions[maxIdx]} (${confidencePct}%)`;
                document.getElementById('time').innerText = `⚡ Total End-to-End Latency: ${inferenceTimeMs} ms`;
                
            } catch (e) {
                console.error(e);
                document.getElementById('result').innerText = "Error running model.";
            }
        }

        document.getElementById('upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('canvas');
                    
                    // FIX 3: Lock Canvas to explicitly use sRGB and CPU memory
                    const ctx = canvas.getContext('2d', { 
                        colorSpace: 'srgb',
                        willReadFrequently: true 
                    });
                    
                    ctx.clearRect(0, 0, 224, 224);
                    ctx.drawImage(img, 0, 0, 224, 224);
                    const imageData = ctx.getImageData(0, 0, 224, 224).data;
                    
                    const floatArray = new Float32Array(224 * 224);
                    for (let i = 0; i < floatArray.length; i++) {
                        let r = imageData[i*4];
                        let g = imageData[i*4 + 1];
                        let b = imageData[i*4 + 2];
                        
                        let gray = (0.299*r + 0.587*g + 0.114*b) / 255.0; 
                        let normalized = (gray - 0.5) / 0.5; 
                        floatArray[i] = normalized;
                    }
                    
                    runInference(floatArray);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
